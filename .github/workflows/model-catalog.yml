name: Build Model Catalog

on:
  schedule:
    # Daily at 7 AM UTC — keeps website/static/api/model-catalog.json fresh
    - cron: '0 7 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_model_catalog.py'
      - 'quill_cli/models.py'
      - '.github/workflows/model-catalog.yml'

permissions:
  contents: read

jobs:
  build-catalog:
    if: github.repository == 'Quill-Agent/Quill-Agent'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'

      - name: Build model catalog
        run: python scripts/build_model_catalog.py

      - name: Upload catalog artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: model-catalog
          path: website/static/api/model-catalog.json
          retention-days: 7
